                        <div class="w-12 h-12 rounded-full bg-applePurple/10 text-applePurple flex items-center justify-center text-xl"><i class="fa-solid fa-crown"></i></div>
                        <div>
                            <span class="text-[10px] text-slate-400 dark:text-slate-500 block font-bold uppercase">${_t('sp_seg_loyal')}</span>
                            <span class="text-2xl font-extrabold text-slate-800 dark:text-white">${loyalCount}</span>
                        </div>
                    </div>
                    <div class="cupertino-glass p-5 rounded-ios-xl shadow-cupertino flex items-center space-x-4 border-l-4 border-appleBlue">
                        <div class="w-12 h-12 rounded-full bg-appleBlue/10 text-appleBlue flex items-center justify-center text-xl"><i class="fa-solid fa-user-plus"></i></div>
                        <div>
                            <span class="text-[10px] text-slate-400 dark:text-slate-500 block font-bold uppercase">${_t('sp_seg_new')}</span>
                            <span class="text-2xl font-extrabold text-slate-800 dark:text-white">${newCount}</span>
                        </div>
                    </div>
                    <div class="cupertino-glass p-5 rounded-ios-xl shadow-cupertino flex items-center space-x-4 border-l-4 border-appleGray">
                        <div class="w-12 h-12 rounded-full bg-slate-200 dark:bg-white/10 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xl"><i class="fa-solid fa-user-minus"></i></div>
                        <div>
                            <span class="text-[10px] text-slate-400 dark:text-slate-500 block font-bold uppercase">${_t('sp_seg_inactive')}</span>
                            <span class="text-2xl font-extrabold text-slate-800 dark:text-white">${inactiveCount}</span>
                        </div>
                    </div>
                </div>

                <!-- Velocity Analysis Table -->
                <div class="cupertino-glass p-5 rounded-ios-xl shadow-cupertino space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-200/50 dark:border-white/5 pb-3">
                        <div>
                            <h4 class="font-bold text-sm text-slate-800 dark:text-white">${_t('sp_velocity_title')}</h4>
                            <p class="text-[10px] text-slate-500 mt-1">${_t('sp_velocity_desc')}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-400 block font-bold uppercase">Avg Velocity</span>
                            <span class="text-lg font-black text-appleGreen">${avgVelocity} Days</span>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-slate-400 uppercase text-[9px] border-b border-slate-200/50 dark:border-white/5">
                                    <th class="p-3">${_t('sp_tbl_cust')}</th>
                                    <th class="p-3">${_t('sp_tbl_reg')}</th>
                                    <th class="p-3">${_t('sp_tbl_first')}</th>
                                    <th class="p-3 text-right">${_t('sp_tbl_velocity')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${velocityHtml || `<tr><td colspan="4" class="p-4 text-center text-slate-400 text-xs">No customer data available.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    function suggestUpsell() {
        const itemInput = document.getElementById('sls-item').value.trim().toLowerCase();
        const container = document.getElementById('sls-upsell-container');
        if (!itemInput || itemInput.length < 2) {
            container.classList.add('hidden');
            return;
        }

        const pairs = {};
        // Look through sales history to find items frequently bought by the same customer
        database.sales.forEach(s1 => {
            if (s1.item.toLowerCase().includes(itemInput)) {
                database.sales.filter(s2 => s2.customerName === s1.customerName && !s2.item.toLowerCase().includes(itemInput)).forEach(s2 => {
                    pairs[s2.item] = (pairs[s2.item] || 0) + 1;
                });
            }
        });

        // Find the top paired item
        const topPair = Object.keys(pairs).sort((a, b) => pairs[b] - pairs[a])[0];
        
        if (topPair) {
            container.innerHTML = `<span class="bg-applePurple/10 text-applePurple px-3.5 py-2.5 rounded-ios-md block border border-applePurple/20"><i class="fa-solid fa-lightbulb mr-1.5 text-appleOrange animate-pulse"></i> <strong>${_t('sl_upsell_badge')}</strong> Customers who bought this also bought <strong>${topPair}</strong>.</span>`;
            container.classList.remove('hidden');
        } else {
            container.classList.add('hidden');
        }
    }
</script>
