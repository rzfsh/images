<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fummac - Premium iOS Accounting Suite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appleBlue: '#007AFF',
                        appleGreen: '#34C759',
                        appleOrange: '#FF9500',
                        appleRed: '#FF3B30',
                        appleIndigo: '#5856D6',
                        applePurple: '#AF52DE',
                        appleGray: '#8E8E93',
                        appleDarkBg: '#1C1C1E',
                        appleDarkCard: '#2C2C2E'
                    },
                    borderRadius: {
                        'ios-sm': '8px',
                        'ios-md': '12px',
                        'ios-lg': '16px',
                        'ios-xl': '24px',
                        'ios-2xl': '32px',
                    },
                    boxShadow: {
                        'cupertino': '0 8px 32px 0 rgba(0, 0, 0, 0.06)',
                        'cupertino-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.4)',
                        'sf-button': '0 2px 8px rgba(0, 122, 255, 0.15)',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Apple-Style UI Symbols -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf.js for sleek vector PDF exports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        @keyframes drawTextLogo {
            0% {
                stroke-dasharray: 800;
                stroke-dashoffset: 800;
                fill: transparent;
            }
            60% {
                stroke-dasharray: 800;
                stroke-dashoffset: 0;
                fill: transparent;
            }
            100% {
                stroke-dasharray: 800;
                stroke-dashoffset: 0;
                fill: url(#elegantTextGrad);
            }
        }
        @keyframes letterStretchLogo {
            0% {
                letter-spacing: -0.05em;
                opacity: 0;
                filter: blur(10px);
            }
            35% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                letter-spacing: 0.16em;
            }
        }
        @keyframes elegantGlow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(0, 122, 255, 0.25)) drop-shadow(0 0 25px rgba(175, 82, 222, 0.15));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 122, 255, 0.5)) drop-shadow(0 0 45px rgba(175, 82, 222, 0.35));
            }
        }
        @keyframes subtleRadialWave {
            0% { transform: scale(0.95); opacity: 0.2; }
            50% { transform: scale(1.15); opacity: 0.35; }
            100% { transform: scale(0.95); opacity: 0.2; }
        }
        .animate-draw-text-logo {
            animation: drawTextLogo 3.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                       letterStretchLogo 3.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                       elegantGlow 4s ease-in-out infinite;
        }
        .radial-glow-backdrop {
            background: radial-gradient(circle, rgba(0,122,255,0.12) 0%, rgba(175,82,222,0.06) 50%, rgba(0,0,0,0) 100%);
            animation: subtleRadialWave 8s ease-in-out infinite;
        }

        @keyframes drawStroke {
            to {
                stroke-dashoffset: 0;
            }
        }
        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(0, 122, 255, 0.55)) drop-shadow(0 0 30px rgba(175, 82, 222, 0.35));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(0, 122, 255, 0.85)) drop-shadow(0 0 45px rgba(175, 82, 222, 0.6));
            }
        }
        @keyframes ripple {
            0% {
                transform: scale(0.85);
                opacity: 0.65;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-draw {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawStroke 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .animate-logo-glow {
            animation: logoGlow 3s ease-in-out infinite;
        }
        .splash-ripple {
            animation: ripple 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        }

        /* Custom dynamic background blobs (Sequoia Wave Effect) */
        .sequoia-blob {
            filter: blur(140px);
            opacity: 0.45;
            mix-blend-mode: multiply;
            animation: drift 25s ease-in-out infinite alternate;
            z-index: 0;
        }

        .dark .sequoia-blob {
            opacity: 0.25;
            mix-blend-mode: screen;
        }

        @keyframes drift {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(40px, -60px) scale(1.15); }
            100% { transform: translate(-30px, 40px) scale(0.9); }
        }

        /* Glassmorphism utilities */
        .cupertino-glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.45);
        }

        .dark .cupertino-glass {
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(30px) saturate(140%);
            -webkit-backdrop-filter: blur(30px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .signature-pad {
            border: 1.5px dashed rgba(142, 142, 147, 0.3);
            background-color: rgba(255, 255, 255, 0.3);
            cursor: crosshair;
            touch-action: none;
            border-radius: 16px;
        }
        
        .dark .signature-pad {
            background-color: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Apple Bounce Effect */
        .apple-active {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .apple-active:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-black overflow-hidden flex flex-col transition-colors duration-500">

<div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#070709] transition-all duration-1000 ease-out">
    <!-- Sophisticated background light wave -->
    <div class="absolute inset-0 radial-glow-backdrop pointer-events-none select-none"></div>
    
    <div class="relative flex flex-col items-center z-10 w-full max-w-sm px-6">
        <!-- Minimalist typographic vector container -->
        <div class="w-full text-center mb-6">
            <svg class="w-full h-auto select-none" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Text with stroke drawing sequence & gradient transitions -->
                <text x="50%" y="65%" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" stroke="url(#elegantTextGrad)" stroke-width="1.2" fill="none" class="animate-draw-text-logo">FUMMAC</text>
                
                <defs>
                    <linearGradient id="elegantTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#007AFF" />
                        <stop offset="45%" stop-color="#AF52DE" />
                        <stop offset="100%" stop-color="#FF3B30" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        
        <!-- Elegant ultra-thin progress line -->
        <div class="w-36 h-[1.5px] bg-white/10 rounded-full overflow-hidden relative">
            <div id="splash-progress" class="absolute left-0 top-0 bottom-0 w-0 bg-gradient-to-r from-appleBlue via-applePurple to-appleRed rounded-full transition-all duration-300 ease-out shadow-[0_0_10px_rgba(0,122,255,0.6)]"></div>
        </div>
        
        <span id="splash-loading-text" class="text-[7px] font-mono text-slate-500 uppercase tracking-[0.25em] mt-3.5 opacity-70">Initializing core...</span>
    </div>
</div>

<div class="fixed inset-0 overflow-hidden pointer-events-none select-none z-0">

</div>

            <i class="fa-solid fa-gear text-lg"></i>

</div>

    // Robust IndexedDB wrapper for large file native storage (bypasses 5MB localStorage limit)
    const DocDB = {
        db: null,
        init: function() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("FummacDocsDB", 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("documents")) {
                        db.createObjectStore("documents", { keyPath: "id" });
                    }
                };
                request.onsuccess = function(e) {
                    DocDB.db = e.target.result;
                    resolve();
                };
                request.onerror = function(e) {
                    console.error("IndexedDB error", e);
                    reject("IndexedDB error");
                };
            });
        },
        save: function(doc) {
            return new Promise((resolve, reject) => {
                const tx = DocDB.db.transaction("documents", "readwrite");
                const store = tx.objectStore("documents");
                store.put(doc);
                tx.oncomplete = resolve;
                tx.onerror = reject;
            });
        },
        getAll: function() {
            return new Promise((resolve, reject) => {
                const tx = DocDB.db.transaction("documents", "readonly");
                const store = tx.objectStore("documents");
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        },
        delete: function(id) {
            return new Promise((resolve, reject) => {
                const tx = DocDB.db.transaction("documents", "readwrite");
                const store = tx.objectStore("documents");
                store.delete(id);
                tx.oncomplete = resolve;
                tx.onerror = reject;
            });
        }
    };

    let dashboardChartInstance = null;
    let salesTrendsChartInstance = null;

    function generateSignature(email, expires) {
        const salt = "FUMMAC_SECURE_2026";
        const str = email + expires + salt;
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return Math.abs(hash).toString(16);
    }

    function checkLicense() {
        const key = localStorage.getItem('fummac_license');
        if (!key) return false;
        try {
            const decoded = atob(key);
            const [email, expires, sig] = decoded.split(':');
            const expectedSig = generateSignature(email, expires);
            if (sig !== expectedSig) return false;
            if (expires !== 'UNLIMITED' && Date.now() > parseInt(expires)) return false;
            return true;
        } catch(e) { return false; }
    }

    function applyLicense() {
        const key = document.getElementById('license-input').value.trim();
        if (!key) return;
        try {
            const decoded = atob(key);
            const [email, expires, sig] = decoded.split(':');
            const expectedSig = generateSignature(email, expires);
            
            if (sig === expectedSig) {
                if (expires !== 'UNLIMITED' && Date.now() > parseInt(expires)) {
                    showCupertinoToast(_t('toast_lic_expired'), _t('toast_lic_expired_msg'), "appleRed", "fa-clock");
                    return;
                }
                localStorage.setItem('fummac_license', key);
                updateUIAfterLicenseCheck();
                showCupertinoToast(_t('toast_lic_valid'), _t('toast_lic_valid_msg'), "appleGreen", "fa-key");
                renderSettings(document.getElementById('module-container'));
            } else {
                showCupertinoToast(_t('toast_lic_invalid'), _t('toast_lic_invalid_msg'), "appleRed", "fa-xmark");
            }
        } catch(e) {
            showCupertinoToast(_t('toast_lic_invalid'), _t('toast_lic_invalid_msg'), "appleRed", "fa-xmark");
        }
    }

    function runSplashScreen() {
        const splash = document.getElementById('splash-screen');
        const progress = document.getElementById('splash-progress');
        const loadText = document.getElementById('splash-loading-text');
        
        const phases = [
            { pct: 25, en: "Initializing Fummac Core...", id: "Inisialisasi Fummac Core..." },
            { pct: 55, en: "Syncing General Ledger...", id: "Sinkronisasi Buku Besar..." },
            { pct: 85, en: "Compiling Financial Modules...", id: "Menyusun Modul Finansial..." },
            { pct: 100, en: "Fummac ERP Ready", id: "Fummac ERP Siap" }
        ];
        
        let currentPhase = 0;
        
        const updateInterval = setInterval(() => {
            if (currentPhase < phases.length) {
                const phase = phases[currentPhase];
                progress.style.width = phase.pct + '%';
                loadText.textContent = currentLang === 'en' ? phase.en : phase.id;
                currentPhase++;
            } else {
                clearInterval(updateInterval);
                setTimeout(() => {
                    // Smooth exit animation
                    splash.classList.add('opacity-0', 'scale-105', 'pointer-events-none');
                    setTimeout(() => {
                        splash.remove(); // Safely clean DOM
                    }, 1000);
                }, 400);
            }
        }, 650);
    }

    function updateUIAfterLicenseCheck() {
        isLicensed = checkLicense();
        renderNavigations();
        document.querySelectorAll('.nav-btn').forEach(btn => {
            const mod = btn.getAttribute('data-module');
            const isLocked = !isLicensed && mod !== 'dashboard' && mod !== 'settings';
            let lockIcon = btn.querySelector('.mobile-lock-icon');
            if (isLocked) {
                if(!lockIcon) btn.innerHTML += '<i class="fa-solid fa-lock absolute top-1 right-2 text-[10px] text-appleRed mobile-lock-icon"></i>';
                btn.classList.add('relative');
            } else {
                if(lockIcon) lockIcon.remove();
            }
        });
    }

    window.onload = function() {
        initTheme();
        loadDataFromStorage();
        DocDB.init().catch(e => console.warn("Document Vault Unavailable", e));
        updateLanguageBtnLabels();
        updateUIAfterLicenseCheck();
        switchModule(activeModule);
        setupMobileMenuEvents();
        // Trigger splash screen sequence on load completion
        runSplashScreen();
    };

    function initTheme() {
        if (localStorage.getItem('cupertino_theme') === 'dark' || 
            (!('cupertino_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }

    function toggleCupertinoTheme() {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('cupertino_theme', 'light');
            showCupertinoToast(_t('toast_theme_title'), _t('toast_theme_light'), "appleBlue", "fa-sun");
        } else {
            document.documentElement.classList.add('dark');
            localStorage.setItem('cupertino_theme', 'dark');
            showCupertinoToast(_t('toast_theme_title'), _t('toast_theme_dark'), "applePurple", "fa-moon");
        }
        if (activeModule === 'dashboard') {
            renderModuleView(activeModule);
        }
    }

    function loadDataFromStorage() {
        const stored = localStorage.getItem('fummac_apple_db');
        if (stored) {
            try {
                database = JSON.parse(stored);
            } catch (e) {
                console.error("Failed loading databases.", e);
            }
        }
        
        // Safety schema sanitization to prevent crashes
        const schemas = ['transactions', 'invoices', 'inventory', 'procurement', 'legal_cases', 'planning', 'payroll', 'attendance', 'leaves', 'kpi', 'assets', 'sales', 'customers', 'activity_logs'];
        schemas.forEach(schema => {
            if (!database || typeof database !== 'object') database = {};
            if (!Array.isArray(database[schema])) {
                database[schema] = [];
            }
        });
    }

    function logSystemActivity(moduleName, action, details) {
        if (!database.activity_logs) database.activity_logs = [];
        const log = {
            id: 'LOG-' + Date.now().toString().slice(-4) + Math.floor(Math.random()*1000),
            timestamp: new Date().toLocaleString(currentLang === 'id' ? 'id-ID' : 'en-US', { hour12: false }),
            moduleName,
            action,
            details
        };
        database.activity_logs.unshift(log);
        if (database.activity_logs.length > 500) database.activity_logs.pop(); 
    }

    function saveData() {
        localStorage.setItem('fummac_apple_db', JSON.stringify(database));
        updateIslandStatus();
    }

    function forceResetDatabase() {
        database = {
            transactions: [],
            invoices: [],
            inventory: [],
            procurement: [],
            legal_cases: [],
            planning: [],
            payroll: [],
            attendance: [],
            leaves: [],
            kpi: [],
            assets: [],

    // Backup & Restore Database controllers
    function exportDatabaseJSON() {
        try {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(database, null, 2));
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Fummac_Backup_Fummac_${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showCupertinoToast(_t('toast_export_success_title'), _t('toast_export_success_msg'), "appleGreen", "fa-file-export");
        } catch (err) {
            console.error(err);
            showCupertinoToast(_t('toast_export_err_title'), _t('toast_export_err_msg'), "appleRed", "fa-circle-xmark");
        }
    }

    function importDatabaseJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                const requiredSchemas = ['transactions', 'invoices', 'inventory', 'procurement', 'legal_cases', 'planning', 'payroll', 'assets', 'sales', 'customers'];
                let isValid = true;
                
                requiredSchemas.forEach(schema => {
                    if (!importedData.hasOwnProperty(schema) || !Array.isArray(importedData[schema])) {
                        isValid = false;
                    }
                });

                if (!isValid) {
                    showCupertinoToast(_t('toast_import_err_title'), _t('toast_import_err_msg'), "appleRed", "fa-triangle-exclamation");
                    return;
                }

                if (!importedData.activity_logs) importedData.activity_logs = [];
                database = importedData;
                logSystemActivity('System', 'Import', 'Database restored from JSON file');
                saveData();
                showCupertinoToast(_t('toast_import_success_title'), _t('toast_import_success_msg'), "appleGreen", "fa-file-import");
                renderModuleView(activeModule);
            } catch (err) {
                console.error(err);
                showCupertinoToast(_t('toast_import_fail_title'), _t('toast_import_fail_msg'), "appleRed", "fa-circle-xmark");
            }
        };
        reader.readAsText(file);
    }

    function expandDynamicIsland() {
        const island = document.getElementById('dynamic-island');
        island.classList.toggle('rounded-full');
        island.classList.toggle('rounded-ios-xl');

        } else {
            islandStatus.textContent = currentLang === 'en' ? "Clean Suite • Ready" : "Sistem Kosong • Ready";
        }
    }

    function showCupertinoToast(title, message, accentColor, iconClass) {
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toast-icon');
        const toastTitle = document.getElementById('toast-title');
        const toastMessage = document.getElementById('toast-message');

        toastTitle.textContent = title;
        toastMessage.textContent = message;
        
        let colorHex = '#007AFF';
        if (accentColor === 'appleGreen') colorHex = '#34C759';
        else if (accentColor === 'appleOrange') colorHex = '#FF9500';
        else if (accentColor === 'appleRed') colorHex = '#FF3B30';
        else if (accentColor === 'applePurple') colorHex = '#AF52DE';

        toastIcon.style.backgroundColor = colorHex;
        toastIcon.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

        toast.classList.remove('translate-y-28', 'opacity-0', 'pointer-events-none');
        toast.classList.add('translate-y-0', 'opacity-100');

        setTimeout(() => {
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('translate-y-28', 'opacity-0', 'pointer-events-none');
        }, 4000);
    }

<script>
    function exportToCSV(filename, dataHeaders, dataRows) {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += dataHeaders.join(",") + "\r\n";
        
        dataRows.forEach(row => {
            let processedRow = row.map(value => {
                let stringVal = value === null || value === undefined ? "" : String(value);
                if (stringVal.includes(",") || stringVal.includes('"') || stringVal.includes("\n") || stringVal.includes(";")) {
                    stringVal = `"${stringVal.replace(/"/g, '""')}"`;
                }
                return stringVal;
            });
            csvContent += processedRow.join(",") + "\r\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `${filename}_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showCupertinoToast(_t('toast_csv_success_title'), _t('toast_csv_success_msg'), "appleGreen", "fa-file-excel");
    }

    function exportToPDF(elementId, filename) {
        const element = document.getElementById(elementId);
        if (!element) return;
        
        const opt = {
            margin:       0.3,
            filename:     `${filename}_${new Date().toISOString().slice(0,10)}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        showCupertinoToast(_t('toast_pdf_start_title'), _t('toast_pdf_start_msg'), "appleOrange", "fa-spinner");
        html2pdf().set(opt).from(element).save().then(() => {
            showCupertinoToast(_t('toast_pdf_success_title'), _t('toast_pdf_success_msg'), "appleGreen", "fa-file-pdf");
        }).catch(err => {
            console.error(err);
            showCupertinoToast(_t('toast_pdf_err_title'), _t('toast_pdf_err_msg'), "appleRed", "fa-circle-xmark");
        });
    }

    function formatIDR(number) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }
</script>

          ],

        }
        `;

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        // Payload configurations with structured response schema
        const payload = {
            contents: [{ parts: [{ text: userPrompt }] }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        executiveSummary: { type: "STRING" },
                        financialHealthScore: { type: "INTEGER" },

                }
            },
            systemInstruction: {
                parts: [{ text: systemPrompt }]
            }

        // Exponential backoff runner
        const fetchWithRetry = async (url, options, retries = 3, delay = 1000) => {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    if (response.status === 429 && retries > 0) {
                        await new Promise(resolve => setTimeout(resolve, delay));

    let sigCanvas, sigCtx, drawing = false;

    function setupSignaturePad() {
        sigCanvas = document.getElementById('signature-pad');
        if (!sigCanvas) return;
        
        sigCanvas.width = sigCanvas.offsetWidth || 500;
        sigCanvas.height = sigCanvas.offsetHeight || 160;

        sigCtx = sigCanvas.getContext('2d');
        sigCtx.strokeStyle = "#007AFF"; // iOS Blue Ink
        sigCtx.lineWidth = 3.5;
        sigCtx.lineCap = "round";

        const getCoordinate = (e) => {
            const rect = sigCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        };

        const startDrawing = (e) => {
            drawing = true;
            const coord = getCoordinate(e);
            sigCtx.beginPath();
            sigCtx.moveTo(coord.x, coord.y);
        };

        const draw = (e) => {
            if (!drawing) return;
            const coord = getCoordinate(e);
            sigCtx.lineTo(coord.x, coord.y);
            sigCtx.stroke();
        };

        const stopDrawing = () => { drawing = false; };

        sigCanvas.addEventListener('mousedown', startDrawing);
        sigCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        sigCanvas.addEventListener('touchstart', startDrawing, { passive: true });
        sigCanvas.addEventListener('touchmove', draw, { passive: true });
        sigCanvas.addEventListener('touchend', stopDrawing);
    }

    function clearSignature() {
        if (!sigCanvas) return;
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
        document.getElementById('prev-sig-box').innerHTML = `<span class="text-slate-300 text-[8px] italic">${_t('inv_signature_blank')}</span>`;

    function saveAndGenerateInvoice() {
        const billingCompany = document.getElementById('inv-bill-company').value.trim();
        const billingAddress = document.getElementById('inv-bill-address').value.trim();
        const creatorName = document.getElementById('inv-creator-name').value.trim();
        const creatorTitle = document.getElementById('inv-creator-title').value.trim();
        const clientCompany = document.getElementById('inv-client-company').value.trim();
        const clientAddress = document.getElementById('inv-client-address').value.trim();

        if (!clientCompany || tempInvoiceItems.length === 0) {
            showCupertinoToast(_t('toast_inv_empty_title'), _t('toast_inv_empty_msg'), "appleRed", "fa-circle-xmark");
            return;
        }

        const signatureDataUrl = sigCanvas.toDataURL();
        document.getElementById('prev-sig-box').innerHTML = `<img src="${signatureDataUrl}" class="max-h-12 w-auto border border-dashed rounded" />`;

        const newInvoice = {
            id: 'INV-' + Date.now().toString().slice(-6),
            billingCompany,
            billingAddress,
            creatorName,
            creatorTitle,
            clientCompany,
            clientAddress,
            items: tempInvoiceItems,
            signature: signatureDataUrl
        };

        database.invoices.push(newInvoice);

        // Synchronize operational revenue directly to the General Ledger
        const totalAmount = tempInvoiceItems.reduce((sum, item) => sum + (item.qty * item.price), 0);
        const autoTx = {
            id: 'TX-' + Date.now().toString().slice(-4),
            date: new Date().toISOString().slice(0, 10),
            code: '4000',

    function exportTransactionsCSV() {

        const rows = database.transactions.map(tx => [
            tx.date,
            tx.id,
            tx.code,
            tx.description,
            tx.type === 'debit' ? tx.amount : 0,
            tx.type === 'credit' ? tx.amount : 0
        ]);
        exportToCSV("General_Ledger_Fummac", headers, rows);
    }

    function downloadJournalTemplate() {
        const headers = ["Date (YYYY-MM-DD)", "Account Code (e.g. 4000)", "Description", "Type (debit/credit)", "Amount"];
        const rows = [
            ["2026-07-28", "5200", "Monthly Office Internet", "credit", "500000"],
            ["2026-07-28", "5000", "Staff Bonuses", "credit", "1500000"],
            ["2026-07-29", "4000", "Bulk Wholesale Order", "debit", "25000000"]
        ];
        exportToCSV("Journal_Batch_Template", headers, rows);
    }

    function processJournalBatchCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            parseAndImportJournalBatch(text);
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function parseAndImportJournalBatch(csvText) {
        const lines = csvText.split(/\r?\n/);
        if (lines.length < 2) {
            showCupertinoToast(_t('toast_batch_err_title'), _t('toast_batch_err_msg'), "appleRed", "fa-circle-xmark");
            return;
        }

        const firstLine = lines[0];
        const commaCount = (firstLine.match(/,/g) || []).length;
        const semiCount = (firstLine.match(/;/g) || []).length;
        const delimiter = semiCount > commaCount ? ';' : ',';

        let addedCount = 0;

        for(let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const columns = line.split(new RegExp(`${delimiter}(?=(?:(?:[^"]*"){2})*[^"]*$)`));
            if (columns.length < 5) continue;

            const date = columns[0].replace(/"/g, '').trim();
            const code = columns[1].replace(/"/g, '').trim();
            const description = columns[2].replace(/"/g, '').trim();
            const type = columns[3].replace(/"/g, '').trim().toLowerCase();
            const amount = parseFloat(columns[4].replace(/"/g, '').trim());

            if (date && code && description && (type === 'debit' || type === 'credit') && !isNaN(amount)) {
                const newTx = {
                    id: 'TX-' + Date.now().toString().slice(-4) + Math.floor(Math.random() * 1000),
                    date,
                    code,
                    description,
                    type,
                    amount
                };
                database.transactions.push(newTx);
                addedCount++;
            }
        }

        if (addedCount > 0) {
            logSystemActivity('Ledger', 'Batch Import', `Imported ${addedCount} journal entries via CSV`);
            saveData();
            const successMsg = currentLang === 'en' ? `${addedCount} transactions added successfully.` : `${addedCount} transaksi berhasil ditambahkan.`;
            showCupertinoToast(_t('toast_batch_ok_title'), successMsg, "appleGreen", "fa-file-import");
            renderTransactions(document.getElementById('module-container'));
        } else {
            showCupertinoToast(_t('toast_batch_err_title'), _t('toast_batch_err_msg'), "appleRed", "fa-circle-xmark");
        }
    }
</script>

        database.transactions.forEach(tx => {
            const code = parseInt(tx.code);
            const amount = tx.amount;
            if (tx.type === 'debit') {
                if (code >= 4000 && code < 5000) totalRevenue += amount;
            } else {
                if (code === 5100) totalHpp += amount;
                else if (code === 5200) totalOperasional += amount;

    function downloadSampleBankCSV() {
        const headers = ["Date", "Description", "Amount", "Type"];
        const rows = [
            ["2026-07-01", "Setoran Modal Awal Pemilik - Presie Holding", "150000000", "credit"],
            ["2026-07-02", "Kas Masuk Penjualan Tunai", "35000000", "debit"],

            ["2026-07-14", "Beban Admin Bank Gelap (Selisih Luar Jurnal)", "50000", "credit"]
        ];
        exportToCSV("Template_Mutasi_Bank", headers, rows);
        showCupertinoToast(_t('toast_rec_sample_ok_title'), _t('toast_rec_sample_ok_msg'), "appleBlue", "fa-file-excel");
    }

    function processBankCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            parseAndMatchBankData(text);
        };
        reader.readAsText(file);
    }

    function parseAndMatchBankData(csvText) {
        const lines = csvText.split(/\r?\n/);
        if (lines.length < 2) {
            showCupertinoToast(_t('toast_rec_err_title'), _t('toast_rec_err_msg'), "appleRed", "fa-circle-xmark");
            return;
        }

        const firstLine = lines[0];
        const commaCount = (firstLine.match(/,/g) || []).length;
        const semiCount = (firstLine.match(/;/g) || []).length;
        const delimiter = semiCount > commaCount ? ';' : ',';

        matchedTransactionsList = [];
        unmatchedBankList = [];

        for(let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const columns = line.split(new RegExp(`${delimiter}(?=(?:(?:[^"]*"){2})*[^"]*$)`));
            if (columns.length < 3) continue;

            const date = columns[0].replace(/"/g, '').trim();
            const description = columns[1].replace(/"/g, '').trim();
            const amount = parseFloat(columns[2].replace(/"/g, '').trim());

            // Automated fuzzy matching algorithm
            const match = database.transactions.find(tx => 
                tx.date === date && 
                Math.abs(tx.amount - amount) < 1.0 
            );

            if (match) {
                matchedTransactionsList.push({ date, description, amount });
            } else {
                unmatchedBankList.push({ date, description, amount });
            }
        }

        const matchedBody = document.getElementById('rec-matched-body');
        const unmatchedBody = document.getElementById('rec-unmatched-body');

        if (!matchedBody || !unmatchedBody) return;

        matchedBody.innerHTML = '';
        unmatchedBody.innerHTML = '';

        if (matchedTransactionsList.length === 0) {
            matchedBody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-slate-400">${_t('rec_no_match')}</td></tr>`;
        } else {
            matchedTransactionsList.forEach(m => {
                matchedBody.innerHTML += `
                    <tr class="border-b border-slate-200/50 dark:border-white/5 bg-appleGreen/5 text-slate-800 dark:text-white">
                        <td class="p-2">${m.date}</td>
                        <td class="p-2 font-medium">${m.description}</td>
                        <td class="p-2 text-right font-extrabold text-appleGreen">${formatIDR(m.amount)}</td>
                    </tr>
                `;
            });
        }

        if (unmatchedBankList.length === 0) {
            unmatchedBody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-appleGreen font-bold">${_t('rec_all_matched')}</td></tr>`;
        } else {
            unmatchedBankList.forEach(u => {
                unmatchedBody.innerHTML += `
                    <tr class="border-b border-slate-200/50 dark:border-white/5 bg-appleRed/5 text-slate-800 dark:text-white">
                        <td class="p-2">${u.date}</td>
                        <td class="p-2 font-medium">${u.description}</td>
                        <td class="p-2 text-right font-extrabold text-appleRed">${formatIDR(u.amount)}</td>
                    </tr>
                `;
            });
        }

        showCupertinoToast(_t('toast_rec_done_title'), _t('toast_rec_done_msg'), "appleOrange", "fa-arrows-spin");
    }
</script>

    function saveSalesOrder() {
        const customer = document.getElementById('sls-customer').value.trim();
        const item = document.getElementById('sls-item').value.trim();
        const qty = parseInt(document.getElementById('sls-qty').value);
        const price = parseFloat(document.getElementById('sls-price').value);
        const status = document.getElementById('sls-status').value;

        if (!customer || !item || isNaN(qty) || isNaN(price)) {
            showCupertinoToast(_t('toast_sl_err_title'), _t('toast_sl_err_msg'), "appleRed", "fa-circle-xmark");
            return;
        }

        const newSales = {
            id: 'SLS-' + Date.now().toString().slice(-4),
            customerName: customer,
            item,
            qty,
            unitPrice: price,
            status,
            date: new Date().toISOString().slice(0, 10)
        };

        database.sales.push(newSales);

        if (status === 'Paid' || status === 'Lunas') {
            const autoTx = {
                id: 'TX-' + Date.now().toString().slice(-4),
                date: new Date().toISOString().slice(0, 10),
                code: '4000',
                description: `${_t('sl_title')}: ${customer}`,
                type: 'debit',
                amount: qty * price
            };
            database.transactions.push(autoTx);
        }

        logSystemActivity('Sales', 'Save', `Recorded sales order for ${customer} (${item})`);
        saveData();
        showCupertinoToast(_t('toast_sl_ok_title'), _t('toast_sl_ok_msg'), "appleGreen", "fa-circle-check");
        renderSales(document.getElementById('module-container'));
    }

    function toggleSalesStatus(id) {
        const sale = database.sales.find(s => s.id === id);
        if (sale) {
            sale.status = (sale.status === 'Paid' || sale.status === 'Lunas') ? 'Unpaid' : 'Paid';
            logSystemActivity('Sales', 'Toggle Status', `Changed payment status for sales order ${id}`);
            saveData();
            showCupertinoToast(_t('toast_sl_status_title'), _t('toast_sl_status_msg'), "appleBlue", "fa-arrows-spin");
            renderSales(document.getElementById('module-container'));
        }
    }

    function deleteSalesOrder(id) {
        database.sales = database.sales.filter(s => s.id !== id);
        logSystemActivity('Sales', 'Delete', `Removed sales order ${id}`);
        saveData();
        showCupertinoToast(_t('toast_sl_del_title'), _t('toast_sl_del_msg'), "appleRed", "fa-trash-can");
        renderSales(document.getElementById('module-container'));
    }

    function autoCalculatePPh21() {
        const salary = parseFloat(document.getElementById('pay-salary').value) || 0;
        const position = document.getElementById('pay-position').value;
        let rate = 0.05;

        if (position === 'Director' || position === 'Commissioner' || position === 'Direktur' || position === 'Komisaris') rate = 0.15;
        else if (position === 'Manager') rate = 0.10;

        const tax = salary * rate;
        document.getElementById('pay-tax-estimate').textContent = formatIDR(tax);
    }

    function syncAttendanceDeductions() {
        const empName = document.getElementById('pay-name').value.trim();
        const salary = parseFloat(document.getElementById('pay-salary').value);
        
        if (!empName || isNaN(salary)) {
            showCupertinoToast("Error", _t('toast_py_sync_err'), "appleRed", "fa-circle-xmark");
            return;
        }

        let unpaidDays = 0;
        database.leaves.forEach(l => {
            if (l.employeeName.toLowerCase() === empName.toLowerCase() && l.type === 'Unpaid') {
                const start = new Date(l.startDate);
                const end = new Date(l.endDate);
                const diffTime = Math.abs(end - start);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // inclusive
                unpaidDays += diffDays;
            }
        });

        // Dynamic Deduction: Assumes standard 20 working days a month
        const dailyRate = salary / 20; 
        const totalDeduction = unpaidDays * dailyRate;

        document.getElementById('pay-deductions').value = Math.round(totalDeduction);
        autoCalculatePPh21();
        
        if (unpaidDays > 0) {
            showCupertinoToast("Sync Success", `Deducted ${unpaidDays} unpaid leave day(s).`, "appleOrange", "fa-user-clock");
        } else {
            showCupertinoToast("No Deductions", "No unpaid leave history found.", "appleBlue", "fa-info-circle");
        }
    }

    function savePayroll() {
        const name = document.getElementById('pay-name').value.trim();
        const position = document.getElementById('pay-position').value;
        const salary = parseFloat(document.getElementById('pay-salary').value);
        const deductions = parseFloat(document.getElementById('pay-deductions').value) || 0;

        if (!name || isNaN(salary)) {
            showCupertinoToast(_t('toast_py_err_title'), _t('toast_py_err_msg'), "appleRed", "fa-circle-xmark");
            return;
        }

        let rate = 0.05;
        if (position === 'Director' || position === 'Commissioner' || position === 'Direktur' || position === 'Komisaris') rate = 0.15;
        else if (position === 'Manager') rate = 0.10;

        const tax = salary * rate;

        const newPay = {
            id: 'PAY-' + Date.now().toString().slice(-4),
            employeeName: name,
            position,
            salary,
            tax,
            deductions,
            dateJoined: new Date().toISOString().slice(0, 10),
            status: 'Active'
        };

        database.payroll.push(newPay);

        // Record salary journal expense transactions
        const netCost = salary + tax; 
        const autoTx = {
            id: 'TX-' + Date.now().toString().slice(-4),
            date: new Date().toISOString().slice(0, 10),
            code: '5000',
            description: `${_t('py_title')}: ${name}`,
            type: 'credit',
            amount: netCost
        };
        database.transactions.push(autoTx);

        logSystemActivity('Payroll', 'Save', `Processed payroll for ${name} (${position})`);
        saveData();
        showCupertinoToast(_t('toast_py_ok_title'), _t('toast_py_ok_msg'), "appleGreen", "fa-circle-check");
        renderPayroll(document.getElementById('module-container'));
    }

    function deletePayroll(id) {
        database.payroll = database.payroll.filter(p => p.id !== id);
        logSystemActivity('Payroll', 'Delete', `Removed payroll record ${id}`);
        saveData();
        showCupertinoToast(_t('toast_py_del_title'), _t('toast_py_del_msg'), "appleRed", "fa-trash-can");
        renderPayroll(document.getElementById('module-container'));
    }
</script>

        const casename = document.getElementById('lgl-casename').value.trim();

        const article = document.getElementById('lgl-article').value.trim();
        const court = document.getElementById('lgl-court').value.trim();
        const lawfirm = document.getElementById('lgl-lawfirm').value.trim();
        const hourly = parseFloat(document.getElementById('lgl-hourly').value);
        const status = document.getElementById('lgl-status').value;
        const trialDate = document.getElementById('lgl-trialdate').value;

        if (!casename || !pic || isNaN(hourly) || !trialDate) {
            showCupertinoToast(_t('toast_lg_err_title'), !trialDate ? _t('toast_lg_err_trial') : _t('toast_lg_err_msg'), "appleRed", "fa-circle-xmark");
            return;
        }

        const newLgl = {
            id: 'LGL-' + Date.now().toString().slice(-4),
            caseName: casename,
            pic,
            article: article || 'General',
            court: court || 'Local District Court',
            lawFirm: lawfirm || 'Independent Counsel',
            hourlyFee: hourly,
            trialDate,
            status
        };

        database.legal_cases.push(newLgl);

        // Record initial legal retainer cost to accounts ledger
        const autoTx = {
            id: 'TX-' + Date.now().toString().slice(-4),
            date: new Date().toISOString().slice(0, 10),
            code: '5300',
            description: `${_t('legal')}: ${casename}`,
            type: 'credit',
            amount: hourly * 5 
        };

        showCupertinoToast(_t('toast_lg_ok_title'), _t('toast_lg_ok_msg'), "appleGreen", "fa-circle-check");
        renderLegal(document.getElementById('module-container'));

        showCupertinoToast(_t('toast_lg_del_title'), _t('toast_lg_del_msg'), "appleRed", "fa-trash-can");
        renderLegal(document.getElementById('module-container'));
    }

<script>
    function renderActivityLog(container) {
        let rowsHtml = '';
        if (database.activity_logs) {
            database.activity_logs.forEach(log => {
                let badgeColor = 'bg-slate-100 text-slate-700';
                if (log.action.includes('Delete') || log.action.includes('Remove') || log.action.includes('Reset') || log.action.includes('Clear')) {
                    badgeColor = 'bg-appleRed/10 text-appleRed';
                } else if (log.action.includes('Save') || log.action.includes('Add') || log.action.includes('Created') || log.action.includes('Import')) {
                    badgeColor = 'bg-appleGreen/10 text-appleGreen';
                } else if (log.action.includes('Toggle') || log.action.includes('Change') || log.action.includes('Update')) {
                    badgeColor = 'bg-appleOrange/10 text-appleOrange';
                }

                rowsHtml += `
                    <tr class="border-b border-slate-200/50 dark:border-white/5 text-slate-800 dark:text-white hover:bg-slate-50/50 dark:hover:bg-white/5 text-xs transition">
                        <td class="p-3 font-mono text-[10px] text-slate-500 whitespace-nowrap">${log.timestamp}</td>
                        <td class="p-3 font-bold text-appleBlue">${log.moduleName}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded font-bold text-[9px] uppercase tracking-wider ${badgeColor}">${log.action}</span></td>
                        <td class="p-3 text-slate-600 dark:text-slate-300 max-w-xs md:max-w-md truncate" title="${log.details}">${log.details}</td>
                    </tr>
                `;
            });
        }

        container.innerHTML = `
            <div class="space-y-6">
                <div class="flex justify-between items-center">
                    <h4 class="font-bold text-slate-800 dark:text-white text-sm"><i class="fa-solid fa-list-check text-applePurple mr-2"></i>${_t('al_title')}</h4>
                    <button onclick="clearActivityLogs()" class="bg-appleRed/10 text-appleRed hover:bg-appleRed/20 text-xs px-3.5 py-2 rounded-ios-md font-semibold transition apple-active flex items-center">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> ${_t('al_btn_clear')}
                    </button>
                </div>

                <div class="cupertino-glass p-1 rounded-ios-xl shadow-cupertino">
                    <div class="overflow-x-auto rounded-ios-lg">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50/50 dark:bg-white/5">
                                <tr class="text-slate-400 uppercase text-[9px] border-b border-slate-200/50 dark:border-white/5">
                                    <th class="p-3 rounded-tl-ios-lg">${_t('al_tbl_date')}</th>
                                    <th class="p-3">${_t('al_tbl_module')}</th>
                                    <th class="p-3">${_t('al_tbl_action')}</th>
                                    <th class="p-3 rounded-tr-ios-lg">${_t('al_tbl_details')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml || `<tr><td colspan="4" class="p-6 text-center text-slate-400 text-xs">${_t('al_empty')}</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    function clearActivityLogs() {
        if(confirm(currentLang === 'id' ? "Apakah Anda yakin ingin menghapus semua log aktivitas?" : "Are you sure you want to clear all activity logs?")) {
            database.activity_logs = [];
            logSystemActivity('System', 'Clear', 'Activity logs cleared by user');
            saveData();
            showCupertinoToast(_t('toast_al_cleared'), _t('toast_al_cleared_msg'), "appleRed", "fa-trash-can");
            renderActivityLog(document.getElementById('module-container'));
        }
    }
</script>

                    </button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Check In/Out Form -->

                        <div class="space-y-3">
                            <input type="text" id="atd-name" placeholder="${_t('atd_fld_name')}" class="w-full px-3.5 py-2 rounded-ios-md border bg-white/50 dark:bg-black/20 dark:border-white/10 text-sm focus:outline-none focus:ring-2 focus:ring-appleBlue dark:text-white">
                            <select id="atd-type" class="w-full px-3.5 py-2 rounded-ios-md border bg-white/50 dark:bg-black/20 dark:border-white/10 text-sm focus:outline-none focus:ring-2 focus:ring-appleBlue dark:text-white">

                                <option value="Out">${_t('atd_type_out')}</option>
                            </select>
                            <button onclick="saveAttendance()" class="w-full bg-appleGreen hover:bg-appleGreen/90 text-white py-2.5 rounded-ios-md text-xs font-bold apple-active shadow-sm transition">
                                ${_t('atd_btn_clock')}
                            </button>

                    </div>

                    <!-- Leave Request Form -->
                    <div class="cupertino-glass p-5 rounded-ios-xl shadow-cupertino space-y-4">
                        <h5 class="font-bold text-xs text-slate-700 dark:text-white uppercase tracking-wider"><i class="fa-solid fa-plane-departure text-appleOrange mr-2"></i>${_t('atd_leave_title')}</h5>

                                <select id="lv-type" class="col-span-2 px-3.5 py-2 rounded-ios-md border bg-white/50 dark:bg-black/20 dark:border-white/10 text-sm focus:outline-none focus:ring-2 focus:ring-appleBlue dark:text-white">

                                        <th class="p-3 text-center">${_t('atd_tbl_action')}</th>

                        </div>

                    <div class="cupertino-glass p-5 rounded-ios-xl shadow-cupertino">
                        <h5 class="font-bold text-xs text-slate-700 dark:text-white mb-3">Active Leave Records</h5>
                        <div class="overflow-x-auto">

                                        <th class="p-3">${_t('atd_tbl_leave')}</th>
                                        <th class="p-3">${_t('atd_tbl_dates')}</th>
                                        <th class="p-3 text-center">${_t('atd_tbl_action')}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${leaveHtml || `<tr><td colspan="4" class="p-4 text-center text-slate-400 text-xs">${_t('atd_empty_leaves')}</td></tr>`}

                            </table>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        document.getElementById('lv-start').value = new Date().toISOString().slice(0, 10);
        document.getElementById('lv-end').value = new Date().toISOString().slice(0, 10);
    }

    function saveAttendance() {
        const name = document.getElementById('atd-name').value.trim();
        const type = document.getElementById('atd-type').value;

        if (!name) {
            showCupertinoToast("Error", "Please enter an employee name", "appleRed", "fa-xmark");
            return;
        }

        const newLog = {
            id: 'ATD-' + Date.now().toString().slice(-4),
            employeeName: name,
            type: type,
            timestamp: new Date().toLocaleString(currentLang === 'id' ? 'id-ID' : 'en-US', { hour12: false })
        };

        database.attendance.push(newLog);
        logSystemActivity('Attendance', 'Log', `${type} logged for ${name}`);
        saveData();
        showCupertinoToast(_t('toast_atd_ok_title'), _t('toast_atd_ok_msg'), "appleGreen", "fa-check");
        renderAttendance(document.getElementById('module-container'));
    }

    function deleteAttendance(id) {
        database.attendance = database.attendance.filter(a => a.id !== id);
        saveData();
        renderAttendance(document.getElementById('module-container'));
    }

    function saveLeave() {
        const name = document.getElementById('lv-name').value.trim();
        const type = document.getElementById('lv-type').value;
        const start = document.getElementById('lv-start').value;
        const end = document.getElementById('lv-end').value;

        if (!name || !start || !end) {
            showCupertinoToast("Error", "Please fill all leave details", "appleRed", "fa-xmark");
            return;
        }

        const newLeave = {
            id: 'LV-' + Date.now().toString().slice(-4),
            employeeName: name,
            type: type,
            startDate: start,
            endDate: end
        };

        database.leaves.push(newLeave);
        logSystemActivity('Attendance', 'Leave', `${type} leave recorded for ${name}`);
        saveData();
        showCupertinoToast(_t('toast_leave_ok_title'), _t('toast_leave_ok_msg'), "appleGreen", "fa-check");
        renderAttendance(document.getElementById('module-container'));
    }

    function deleteLeave(id) {
        database.leaves = database.leaves.filter(l => l.id !== id);
        saveData();
        renderAttendance(document.getElementById('module-container'));
    }
</script>

<script>

    function saveKPI() {
        const emp = document.getElementById('kpi-emp').value.trim();
        const period = document.getElementById('kpi-period').value.trim();
        const target = document.getElementById('kpi-target').value.trim();
        let progress = parseInt(document.getElementById('kpi-progress').value);

        if (!emp || !period || !target || isNaN(progress)) {
            showCupertinoToast("Error", "Please fill out all KPI fields properly", "appleRed", "fa-xmark");
            return;
        }

        if(progress < 0) progress = 0;
        if(progress > 100) progress = 100;

        const newKPI = {
            id: 'KPI-' + Date.now().toString().slice(-4),
            employeeName: emp,
            period,
            target,
            progress
        };

        database.kpi.push(newKPI);
        logSystemActivity('Performance KPI', 'Save', `Saved objective for ${emp} (${progress}%)`);
        saveData();
        showCupertinoToast(_t('toast_kpi_ok_title'), _t('toast_kpi_ok_msg'), "appleGreen", "fa-bullseye");
        renderKPI(document.getElementById('module-container'));
    }

    function deleteKPI(id) {
        database.kpi = database.kpi.filter(k => k.id !== id);
        logSystemActivity('Performance KPI', 'Delete', `Removed KPI record ${id}`);
        saveData();
        showCupertinoToast(_t('toast_kpi_del_title'), _t('toast_kpi_del_msg'), "appleRed", "fa-trash");
        renderKPI(document.getElementById('module-container'));

    async function runKPIAnalysis() {
        const empName = document.getElementById('kpi-ai-emp').value;
        if(!empName) {
            showCupertinoToast("Alert", _t('kpi_sel_emp'), "appleOrange", "fa-user-circle");
            return;
        }

        const apiKey = "AQ.Ab8RN6IZ3hHnZIk1_Ffd6SiQhPgMG4UIvic93d0pCQWNRFeLGA";
        const btn = document.getElementById('btn-kpi-ai');
        const output = document.getElementById('kpi-ai-output');
        
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-1.5"></i> <span>Evaluating...</span>`;
        output.classList.remove('hidden');
        output.innerHTML = `
            <div class="flex flex-col items-center justify-center py-6 space-y-3">
                <div class="w-8 h-8 border-4 border-applePurple border-t-transparent rounded-full animate-spin"></div>
                <p class="text-[10px] text-slate-500 font-medium animate-pulse text-center">${_t('kpi_ai_loading')}</p>
            </div>
        `;

        const empKPIs = database.kpi.filter(k => k.employeeName === empName);
        const empLeaves = database.leaves.filter(l => l.employeeName === empName);

        const systemPrompt = "You are a professional HR Director performing an objective employee evaluation.";
        const userPrompt = `
        Evaluate the employee "${empName}" based on these real records:
        KPI Targets & Progress Data: ${JSON.stringify(empKPIs)}
        Leave/Absences Data: ${JSON.stringify(empLeaves)}
        
        Respond ONLY in ${currentLang === 'id' ? 'Bahasa Indonesia' : 'English'} using this strict JSON schema:
        {
          "evaluationSummary": "A solid paragraph reviewing their target completion and attendance correlation.",
          "performanceScore": <integer 0-100 reflecting overall value>,
          "rating": "A short label like Excellent, Good, Average, or Needs Improvement",
          "strengths": ["...", "..."],
          "areasForImprovement": ["...", "..."]
        }
        `;

        const payload = {
            contents: [{ parts: [{ text: userPrompt }] }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        evaluationSummary: { type: "STRING" },
                        performanceScore: { type: "INTEGER" },
                        rating: { type: "STRING" },
                        strengths: { type: "ARRAY", items: { type: "STRING" } },
                        areasForImprovement: { type: "ARRAY", items: { type: "STRING" } }
                    },
                    required: ["evaluationSummary", "performanceScore", "rating", "strengths", "areasForImprovement"]
                }
            },
            systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error("HTTP Error " + response.status);
            
            const result = await response.json();
            const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
            const evalData = JSON.parse(jsonText);

            let scoreColor = 'text-appleGreen bg-appleGreen/10';
            if (evalData.performanceScore < 60) scoreColor = 'text-appleRed bg-appleRed/10';
            else if (evalData.performanceScore < 80) scoreColor = 'text-appleOrange bg-appleOrange/10';

            output.innerHTML = `
                <div class="space-y-4 animate-fadeIn bg-slate-50/50 dark:bg-black/20 p-4 rounded-ios-lg border border-slate-200/50 dark:border-white/5">
                    <div class="flex items-center justify-between border-b border-slate-200/50 dark:border-white/5 pb-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-white/10 flex items-center justify-center font-bold text-slate-700 dark:text-white">
                                ${empName.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <h5 class="font-bold text-sm text-slate-800 dark:text-white">${empName}</h5>
                                <span class="text-[10px] text-slate-500 uppercase tracking-wider">AI Performance Review</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-black ${scoreColor.split(' ')[0]}">${evalData.performanceScore}</span><span class="text-xs text-slate-400">/100</span>
                            <div class="mt-1 px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase ${scoreColor} inline-block">${evalData.rating}</div>
                        </div>
                    </div>
                    
                    <p class="text-xs leading-relaxed text-slate-700 dark:text-slate-300 text-justify">${evalData.evaluationSummary}</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                        <div>
                            <h6 class="text-[10px] font-bold text-appleGreen uppercase tracking-wider mb-2"><i class="fa-solid fa-arrow-trend-up mr-1.5"></i>Strengths</h6>
                            <ul class="space-y-1.5 pl-1">
                                ${evalData.strengths.map(s => `<li class="text-[11px] text-slate-600 dark:text-slate-400 flex items-start"><span class="text-appleGreen mr-2">•</span> <span class="flex-1">${s}</span></li>`).join('')}
                            </ul>
                        </div>
                        <div>
                            <h6 class="text-[10px] font-bold text-appleOrange uppercase tracking-wider mb-2"><i class="fa-solid fa-wrench mr-1.5"></i>Areas For Improvement</h6>
                            <ul class="space-y-1.5 pl-1">
                                ${evalData.areasForImprovement.map(a => `<li class="text-[11px] text-slate-600 dark:text-slate-400 flex items-start"><span class="text-appleOrange mr-2">•</span> <span class="flex-1">${a}</span></li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
            logSystemActivity('Performance KPI', 'Audit', `Generated AI Review for ${empName}`);
        } catch (err) {
            console.error(err);
            output.innerHTML = `
                <div class="bg-appleRed/5 border border-appleRed/10 p-4 rounded-ios-lg flex items-start space-x-3 text-slate-700 dark:text-slate-300 animate-fadeIn">
                    <i class="fa-solid fa-circle-exclamation text-appleRed text-lg mt-0.5"></i>
                    <div>
                        <h5 class="font-bold text-xs text-appleRed">Evaluation Failed</h5>
                        <p class="text-[10px] leading-relaxed mt-1">Unable to connect to Google Gemini services. Please verify your connection.</p>
                    </div>
                </div>
            `;
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> <span>${_t('kpi_btn_ai')}</span>`;
        }
    }
</script>

<script>
    // Document Management Module (Using IndexedDB for native blob storage)
    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    async function renderDocuments(container, searchQuery = '') {
        let docs = [];
        try {
            if (!DocDB.db) await DocDB.init();
            docs = await DocDB.getAll();
        } catch (e) {
            console.error("Failed to load documents", e);
        }

        if (searchQuery) {
            docs = docs.filter(d => d.name.toLowerCase().includes(searchQuery.toLowerCase()));
        }

        let rowsHtml = '';
        docs.sort((a,b) => b.timestamp.localeCompare(a.timestamp)).forEach(d => {
            let iconClass = 'fa-file';
            let colorClass = 'text-slate-500';
            if (d.type.includes('pdf')) { iconClass = 'fa-file-pdf'; colorClass = 'text-appleRed'; }
            else if (d.type.includes('image')) { iconClass = 'fa-file-image'; colorClass = 'text-appleBlue'; }
            else if (d.type.includes('video')) { iconClass = 'fa-file-video'; colorClass = 'text-applePurple'; }
            else if (d.type.includes('csv') || d.type.includes('excel') || d.type.includes('spreadsheet')) { iconClass = 'fa-file-csv'; colorClass = 'text-appleGreen'; }

            const typeExt = d.name.split('.').pop().toUpperCase() || 'FILE';

            rowsHtml += `
                <tr class="border-b border-slate-200/50 dark:border-white/5 text-slate-800 dark:text-white hover:bg-slate-50/50 dark:hover:bg-white/5 text-xs transition">
                    <td class="p-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-ios-sm bg-slate-100 dark:bg-white/10 flex items-center justify-center shrink-0"><i class="fa-solid ${iconClass} ${colorClass} text-lg"></i></div>
                            <span class="font-semibold truncate max-w-[150px] md:max-w-xs" title="${d.name}">${d.name}</span>
                        </div>
                    </td>
                    <td class="p-3 text-[10px] text-slate-500 font-bold tracking-wider"><span class="px-2 py-0.5 rounded bg-slate-100 dark:bg-white/10">${typeExt}</span></td>
                    <td class="p-3 text-slate-600 dark:text-slate-400 font-mono">${formatBytes(d.size)}</td>
                    <td class="p-3 text-slate-600 dark:text-slate-400 text-[10px]">${d.timestamp}</td>
                    <td class="p-3 text-center space-x-1 whitespace-nowrap">
                        <button onclick="openDocument('${d.id}')" class="text-appleBlue hover:text-appleBlue/80 transition bg-appleBlue/10 p-2 rounded-ios-sm" title="Open"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
                        <button onclick="deleteDocument('${d.id}')" class="text-appleRed hover:text-appleRed/80 transition bg-appleRed/10 p-2 rounded-ios-sm" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });

        container.innerHTML = `
            <div class="space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <h4 class="font-bold text-slate-800 dark:text-white text-sm"><i class="fa-solid fa-folder-open text-appleOrange mr-2"></i>${_t('doc_title')}</h4>
                    <div class="flex space-x-2 w-full md:w-auto">
                        <div class="relative flex-1 md:w-64">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="doc-search-input" value="${searchQuery}" placeholder="${_t('doc_search')}" class="w-full pl-9 pr-3.5 py-2 rounded-ios-md border border-slate-200 dark:border-white/10 bg-white/50 dark:bg-black/20 text-sm focus:outline-none focus:ring-2 focus:ring-appleBlue dark:text-white transition" onkeyup="if(event.key === 'Enter') searchDocuments()">
                        </div>
                        <input type="file" id="doc-upload-input" accept="image/*,video/*,.pdf,.csv" class="hidden" onchange="handleDocUpload(event)">
                        <button onclick="document.getElementById('doc-upload-input').click()" class="bg-appleBlue text-white text-xs px-4 py-2 rounded-ios-md font-bold shadow-md apple-active flex items-center shrink-0 transition hover:bg-appleBlue/90">
                            <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> <span class="hidden sm:inline">${_t('doc_btn_upload')}</span><span class="sm:hidden">Upload</span>
                        </button>
                    </div>
                </div>

                <div class="cupertino-glass p-1 rounded-ios-xl shadow-cupertino">
                    <div class="overflow-x-auto rounded-ios-lg">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50/50 dark:bg-white/5">
                                <tr class="text-slate-400 uppercase text-[9px] border-b border-slate-200/50 dark:border-white/5">
                                    <th class="p-3 rounded-tl-ios-lg">${_t('doc_tbl_name')}</th>
                                    <th class="p-3">${_t('doc_tbl_type')}</th>
                                    <th class="p-3">${_t('doc_tbl_size')}</th>
                                    <th class="p-3">${_t('doc_tbl_date')}</th>
                                    <th class="p-3 rounded-tr-ios-lg text-center">${_t('doc_tbl_action')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml || `<tr><td colspan="5" class="p-6 text-center text-slate-400 text-xs font-medium">${_t('doc_empty')}</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    function searchDocuments() {
        const query = document.getElementById('doc-search-input').value;
        renderDocuments(document.getElementById('module-container'), query);
    }

    async function handleDocUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (!DocDB.db) await DocDB.init();

        const newDoc = {
            id: 'DOC-' + Date.now().toString(),
            name: file.name,
            type: file.type || 'application/octet-stream',
            size: file.size,
            file: file,
            timestamp: new Date().toLocaleString(currentLang === 'id' ? 'id-ID' : 'en-US', { hour12: false })
        };

        try {
            await DocDB.save(newDoc);
            logSystemActivity('Document Vault', 'Upload', `Uploaded document ${file.name}`);
            showCupertinoToast(_t('toast_doc_up_title'), _t('toast_doc_up_msg'), "appleBlue", "fa-cloud-arrow-up");
            renderDocuments(document.getElementById('module-container'));
        } catch(e) {
            console.error(e);
            showCupertinoToast("Error", "Storage quota exceeded or database error.", "appleRed", "fa-xmark");
        }
        
        // Clear input
        event.target.value = '';
    }

    async function openDocument(id) {
        try {
            const docs = await DocDB.getAll();
            const doc = docs.find(d => d.id === id);
            if (doc && doc.file) {
                const url = URL.createObjectURL(doc.file);
                window.open(url, '_blank');
                // We intentionally leave the object URL active so the new tab can read it
                // Modern browsers clean it up safely when the host document unloads
            }
        } catch (e) {
            console.error("Failed to open document", e);
        }
    }

    async function deleteDocument(id) {
        try {
            await DocDB.delete(id);
            logSystemActivity('Document Vault', 'Delete', `Removed document record`);
            showCupertinoToast(_t('toast_doc_del_title'), _t('toast_doc_del_msg'), "appleRed", "fa-trash-can");
            renderDocuments(document.getElementById('module-container'));
        } catch (e) {
            console.error("Failed to delete document", e);
        }
    }
</script>

<script>
    function renderSpecialties(container) {
        // 1. Sales Velocity
        let velocityHtml = '';
        let totalVelocity = 0;
        let validVelocityCount = 0;

        database.customers.forEach(c => {
            const regDateStr = c.dateRegistered || new Date().toISOString().slice(0, 10); // fallback for older entries
            const regDate = new Date(regDateStr);
            
            // Find first sales order for this customer
            const cSales = database.sales.filter(s => s.customerName.toLowerCase() === c.name.toLowerCase() && s.date);
            cSales.sort((a,b) => new Date(a.date) - new Date(b.date));
            
            let velocityDisplay = '-';
            let firstSaleDateDisplay = '-';
            if (cSales.length > 0) {
                const firstSaleDate = new Date(cSales[0].date);
                firstSaleDateDisplay = cSales[0].date;
                const diffTime = firstSaleDate - regDate;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const finalDays = diffDays >= 0 ? diffDays : 0;
                velocityDisplay = finalDays + ' Days';
                totalVelocity += finalDays;
                validVelocityCount++;
            }

            velocityHtml += `
                <tr class="border-b border-slate-200/50 dark:border-white/5 text-slate-800 dark:text-white hover:bg-slate-50/50 dark:hover:bg-white/5 text-xs transition">
                    <td class="p-3 font-semibold">${c.name}</td>
                    <td class="p-3 font-mono text-[10px] text-slate-500">${regDateStr}</td>
                    <td class="p-3 font-mono text-[10px] text-appleBlue">${firstSaleDateDisplay}</td>
                    <td class="p-3 text-right font-extrabold ${velocityDisplay !== '-' ? 'text-appleGreen' : 'text-slate-400'}">${velocityDisplay}</td>
                </tr>
            `;
        });

        const avgVelocity = validVelocityCount > 0 ? Math.round(totalVelocity / validVelocityCount) : 0;

        // 2. Customer Segmentation
        let loyalCount = 0;
        let newCount = 0;
        let inactiveCount = 0;

        database.customers.forEach(c => {
            const cSales = database.sales.filter(s => s.customerName.toLowerCase() === c.name.toLowerCase());
            if (cSales.length > 3) loyalCount++;
            else if (cSales.length >= 1 && cSales.length <= 3) newCount++;
            else inactiveCount++;
        });

        container.innerHTML = `
            <div class="space-y-6">
                <div class="flex justify-between items-center">
                    <h4 class="font-bold text-slate-800 dark:text-white text-sm"><i class="fa-solid fa-star text-appleOrange mr-2"></i>${_t('sp_title')}</h4>
